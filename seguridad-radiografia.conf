# Cabeceras de /radiografia/ (29-oct-2026). Las mismas que seguridad.conf con tres cambios, porque esta
# página habla con Supabase y graba audio:
#   · connect-src abre https://tfhmeoiryhuivdnpwpjs.supabase.co (las funciones estudio_*);
#   · Permissions-Policy deja el micrófono a la propia página (microphone=(self)) para el audio;
#   · X-Robots-Tag noindex y sin caché: cada enlace es personal y no debe acabar en Google ni en un proxy.
# Va aparte porque add_header no se hereda (ver seguridad.conf).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cache-Control "no-store" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://tfhmeoiryhuivdnpwpjs.supabase.co; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
