<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estándar · boceto</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#1B1E3A;font-family:system-ui,sans-serif}
nav{display:flex;justify-content:space-between;padding:28px 80px;font-weight:700}
nav a{background:#1B1E3A;color:#fff;padding:12px 20px;border-radius:999px;font-size:15px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:60px 80px}
h1{font-size:72px;line-height:1;letter-spacing:-.03em}
.hero p{font-size:20px;line-height:1.5;color:#4a4f73;margin-top:24px}
.hero .btn{display:inline-block;margin-top:32px;background:#8F9BFF;color:#1B1E3A;padding:18px 28px;border-radius:12px;font-weight:700}
.shot{background:#F2F3FB;border-radius:20px;height:380px;padding:24px;display:grid;gap:12px}
.shot div{background:#fff;border-radius:10px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:0 80px}
.cards div{border:1px solid #e3e5f2;border-radius:16px;padding:22px;height:150px;font-weight:600}
</style></head><body>
<nav><span>Padrón IA</span><a>Hablamos</a></nav>
<section class="hero"><div><h1>Tu negocio, en orden.</h1><p>Clientes que no se pierden, seguimiento al día, facturas y trimestre listos, un WhatsApp que contesta.</p><a class="btn">Pide tu revisión gratis</a></div><div class="shot"><div></div><div></div><div></div></div></section>
<section class="cards"><div>Clientes que se van</div><div>Seguimiento</div><div>Facturas y trimestre</div><div>WhatsApp</div></section>
</body></html>
